# Paths
maf_dir: example_data/example.maf/
reference_fasta: example_data/example.reference.fa

# Output location
results_dir: example_results

# Direct MAF pipeline options
# max_missing_count: 0
max_missing_fraction: 0.0
mask_indel_adjacent_snps: false
allow_multiallelic_snps: true
add_ref: false

# Rule-specific resources
maf_threads: 2
maf_mem_mb: 96000
maf_time: "72:00:00"

# SLURM profile defaults
slurm_account: jrigrp
slurm_partition: high
